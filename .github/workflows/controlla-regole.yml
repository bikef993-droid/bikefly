name: Controlla regole online
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd strumenti/notifiche && npm install --silent --no-audit --no-fund
      - name: Legge le regole attive su Firebase e cerca le novità della 14.2
        env:
          CHIAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd strumenti/notifiche
          node --input-type=module -e '
          import admin from "firebase-admin";
          const sa = JSON.parse(process.env.CHIAVE);
          const { access_token } = await admin.credential.cert(sa).getAccessToken();
          const h = { Authorization: "Bearer " + access_token };
          const base = "https://firebaserules.googleapis.com/v1/";
          const rel = await (await fetch(base + "projects/" + sa.project_id + "/releases/cloud.firestore", { headers: h })).json();
          if (!rel.rulesetName) { console.log("::warning::RISPOSTA STRANA: " + JSON.stringify(rel).slice(0, 200)); process.exit(0); }
          const rs = await (await fetch(base + rel.rulesetName, { headers: h })).json();
          const testo = (rs.source?.files || []).map(f => f.content).join("\n");
          const quando = rel.updateTime || "";
          if (testo.includes("faseAvanti")) console.log("::notice::REGOLE 14.3.1 ATTIVE: minimo 2 ore e pagamenti protetti (pubblicate " + quando + ")");
          else if (testo.includes("timestamp.date(2026, 11, 30)")) console.log("::warning::REGOLE 14.3 (manca la 14.3.1): apertura a tutti dal 1 dicembre (pubblicate " + quando + ")");
          else if (testo.includes("pushLancio")) console.log("::warning::REGOLE CON AVVISAMI ma senza apertura del 1 dicembre (pubblicate " + quando + ")");
          else if (testo.includes("regoleAccettate")) console.log("::warning::REGOLE DELLA 14.2, manca Avvisami (pubblicate " + quando + ")");
          else if (testo.includes("pushWeb")) console.log("::warning::REGOLE VECCHIE (14.1.5, pubblicate " + quando + ")");
          else console.log("::warning::REGOLE MOLTO VECCHIE (pubblicate " + quando + ")");
          '
