name: Controlla regole online
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Legge il contatore pubblico dei Pionieri (permesso solo con le regole nuove)
        run: |
          K=AIzaSyCMpYlrzCp6QgxvDzV7qqTDPJH4NFvkT9w
          R=$(curl -s "https://firestore.googleapis.com/v1/projects/bikefly-6078c/databases/(default)/documents/contatori/pubblico?key=$K")
          echo "$R"
          if echo "$R" | grep -q PERMISSION_DENIED; then echo "::warning::REGOLE VECCHIE"; else echo "::notice::REGOLE NUOVE ATTIVE"; fi
