name: Controlla regole online
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Legge la chiave pubblica delle notifiche (permesso solo con le regole della 14.1.5)
        run: |
          K=AIzaSyCMpYlrzCp6QgxvDzV7qqTDPJH4NFvkT9w
          R=$(curl -s "https://firestore.googleapis.com/v1/projects/bikefly-6078c/databases/(default)/documents/config/push?key=$K")
          if echo "$R" | grep -q PERMISSION_DENIED; then echo "::warning::REGOLE VECCHIE"
          elif echo "$R" | grep -q publicKey; then echo "::notice::REGOLE NUOVE ATTIVE (chiave notifiche leggibile)"
          else echo "::warning::RISPOSTA STRANA: $(echo "$R" | head -c 150 | tr '\n' ' ')"; fi
