name: Prova Bikefly Web
on:
  workflow_run:
    workflows: ["Pubblica il sito"]
    types: [completed]
  workflow_dispatch:
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          cat > prova.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ ...devices['iPhone 13'] });
          const errori = [];
          p.on('pageerror', e => errori.push('JS: ' + e.message));
          p.on('console', m => { if (m.type() === 'error') errori.push('console: ' + m.text()); });
          await p.goto('https://bikef993-droid.github.io/bikefly/app/?v=' + Date.now(), { waitUntil: 'networkidle' });
          await p.waitForTimeout(4000);
          const accesso = await p.isVisible('#accesso');
          await p.screenshot({ path: 'web.png' });
          console.log('accesso visibile:', accesso);
          for (const e of errori) console.log('::warning title=Bikefly Web::' + e.replace(/\n/g, ' '));
          if (!accesso) console.log('::error title=Bikefly Web::La schermata di accesso non compare');
          console.log('::notice title=Bikefly Web::accesso=' + accesso + ' errori=' + errori.length);
          await b.close();
          JS
          sleep 30
          node prova.mjs
