<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scarica BikeFly</title><meta name="theme-color" content="#071226">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071226;color:#F3F6FB;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
a{display:block;margin:12px auto;max-width:320px;padding:16px;border-radius:99px;font-weight:700;text-decoration:none}
.a{background:#F3F6FB;color:#071226}.b{border:2px solid rgba(243,246,251,.35);color:#F3F6FB}</style></head>
<body><main><h1>🚲 BikeFly</h1><p id="t">Un attimo…</p>
<a class="a" href="../bikefly.apk">Scarica per Android</a><a class="b" href="../app/">Usa BikeFly Web (iPhone)</a></main>
<script>
// Android scarica l'app, iPhone e computer aprono BikeFly Web
var ua = navigator.userAgent || "";
var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (/Android/i.test(ua)) { document.getElementById("t").textContent = "Ti porto alla guida per Android…"; location.replace("../installa/?os=android"); }
else if (ios) { document.getElementById("t").textContent = "Apro BikeFly Web…"; location.replace("../app/"); }
else { document.getElementById("t").textContent = "Scegli come usare BikeFly:"; }
</script></body></html>
